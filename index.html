/* ================================================================
   아래부터는 화면을 그려주는 코드입니다. (수정 필요 없음)
   ================================================================ */

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const countText = document.getElementById('countText');

function initials(name){
  return name.trim().slice(0,1).toUpperCase();
}

function avatarInner(entity){
  // image가 있으면 사진을, 없으면 이니셜 글자를 보여줘요
  if(entity.image){
    return `<img src="${entity.image}" alt="${entity.name || ''}">`;
  }
  return entity.avatarText || initials(entity.name || '?');
}

function renderProfile(){
  const card = document.getElementById('profileCard');
  if(!PROFILE){ card.style.display = 'none'; return; }

  const linksHtml = (PROFILE.links || []).map(l =>
    `<a class="profile-link" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`
  ).join('');

  card.innerHTML = `
    <div class="profile-avatar" style="background:${PROFILE.color || '#FF7FA6'}">${avatarInner(PROFILE)}</div>
    <div class="profile-info">
      <p class="profile-name">${PROFILE.name || ''}</p>
      <p class="profile-bio">${PROFILE.bio || ''}</p>
    </div>
    ${linksHtml ? `<div class="profile-links">${linksHtml}</div>` : ''}
  `;
}

function render(){
  grid.innerHTML = '';
  countText.textContent = '🩷 ' + CHARACTERS.length + '개의 캐릭터';

  if(CHARACTERS.length === 0){
    grid.innerHTML = '<div class="empty">아직 등록된 캐릭터가 없어요. 스크립트의 CHARACTERS 배열에 추가해보세요 🎀</div>';
    return;
  }

  CHARACTERS.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', c.name + ' 상세보기');

    const platformCount = c.platforms ? c.platforms.length : 0;
    const firstPlatformLabel = platformCount > 0 ? c.platforms[0].label : '링크 없음';

    card.innerHTML = `
      <span class="card-no">No. ${String(i+1).padStart(3,'0')}</span>
      <div class="avatar" style="background:${c.color || '#FF7FA6'}">${avatarInner(c)}</div>
      <p class="card-name">${c.name}</p>
      <p class="card-desc">${c.desc || ''}</p>
      <div class="card-platform">
        <span>${platformCount > 1 ? firstPlatformLabel + ' 외 ' + (platformCount-1) : firstPlatformLabel}</span>
        <span>→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(c));
    card.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(c); }
    });

    grid.appendChild(card);
  });
}

function openModal(c){
  document.getElementById('modalAvatar').style.background = c.color || '#FF7FA6';
  document.getElementById('modalAvatar').innerHTML = avatarInner(c);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalDesc').textContent = c.desc || '';

  const list = document.getElementById('platformList');
  list.innerHTML = '';

  if(!c.platforms || c.platforms.length === 0){
    list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">등록된 플랫폼 링크가 없어요.</p>';
  } else {
    c.platforms.forEach(p => {
      const a = document.createElement('a');
      a.className = 'platform-link';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${p.label}</span><span class="arrow">↗</span>`;
      list.appendChild(a);
    });
  }

  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

renderProfile();
render();
</script>

</body>
</html>
