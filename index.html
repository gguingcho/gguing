    --pink-deep: #FF8FAE;
    --pink-tint: #FFF3F7;
    --white: #FFFFFF;
    --ink: #5C4A52;
    --ink-soft: #B79CA8;
    --line: #FBDCE6;
    --shadow: rgba(255, 143, 174, 0.16);

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    background-color: #FFFDFE;
    background-image: radial-gradient(circle, rgba(255,182,206,0.5) 1.4px, transparent 1.4px);

    position: relative;

  .deco-star{

    color: var(--pink);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  .deco-star.d1{ top: 9%;  left: 6%;  font-size: 18px; }
  .deco-star.d2{ top: 16%; right: 8%; font-size: 12px; }
  .deco-star.d3{ bottom: 20%; left: 4%; font-size: 14px; }
  .deco-star.d4{ bottom: 10%; right: 6%; font-size: 20px; }

  .top-spacer{ height: 60px; }

  .profile-wrap{

    margin: 0 auto;
    padding: 0 24px 46px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .profile-photo{
    width: 92px; height: 92px;
    border-radius: 50%;
    margin: 0 auto 16px;
    overflow: hidden;
    background: var(--pink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: #fff;
    border: 4px solid var(--white);
    box-shadow: 0 0 0 3px var(--pink), 0 10px 24px -12px var(--shadow);
  }
  .profile-photo img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .profile-name{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .profile-name .star{ color: var(--pink-deep); font-size: 13px; }
  .profile-bio{
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .profile-links{
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .profile-link{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--pink-deep);
    text-decoration: none;
    background: var(--pink-tint);
    border: 1.5px solid var(--line);
    padding: 7px 16px;
    border-radius: 999px;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }
  .profile-link:hover{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }

    justify-content: center;
    gap: 6px;
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }
  .dot-divider span{
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--pink);
    opacity: 0.5;
  }

  .filter-bar{
    max-width: 1040px;
    margin: 0 auto 28px;
    padding: 0 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .filter-chip{
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--white);
    border: 1.5px solid var(--line);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }
  .filter-chip .count{
    margin-left: 4px;
    font-size: 10.5px;
    opacity: 0.75;
  }
  .filter-chip:hover{
    border-color: var(--pink);
    color: var(--pink-deep);
  }
  .filter-chip.active{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }
  .filter-chip:focus-visible{
    outline: 2px solid var(--pink-deep);
    outline-offset: 2px;
  }

  main{
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px 100px;
    position: relative;
    z-index: 1;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }

  .card{
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 16px 16px 18px;
    cursor: pointer;
    box-shadow: 0 8px 20px -14px var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display:flex;
    flex-direction: column;
    position: relative;
    animation: cardIn 0.25s ease both;
  }
  @keyframes cardIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .card:hover, .card:focus-visible{
    transform: translateY(-5px);
    border-color: var(--pink);
    box-shadow: 0 16px 28px -14px var(--shadow);
    outline: none;
  }
  .card:focus-visible{
    outline: 2px solid var(--pink-deep);
    outline-offset: 3px;
  }

  .card-photo{
    width: 56px; height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--pink);

    font-family:'Poppins', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    border: 3px solid var(--pink-tint);

    line-height: 1.55;
    color: var(--ink-soft);

  .card-platform{

    padding-top: 10px;
    border-top: 1.5px dotted var(--line);
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    color: var(--pink-deep);
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .card-platform span:last-child{ transition: transform 0.18s ease; }
  .card:hover .card-platform span:last-child{ transform: translateX(3px); }

  .overlay{

    background: rgba(255, 243, 247, 0.75);

    padding: 24px;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease;
    z-index: 50;

  .overlay.open{ opacity:1; pointer-events:auto; }

    color: var(--ink);

    width:100%;
    border-radius: 24px;
    padding: 28px 24px 24px;

    border: none;

    padding: 50px 20px;

/* ================================================================
   아래부터는 화면을 그려주는 코드입니다. (수정 필요 없음)
   ================================================================ */

const ALL_LABEL = "전체";   // 전체 버튼 글자 (원하면 "ALL" 등으로 바꿔도 돼요)

const grid = document.getElementById('grid');
const filterBar = document.getElementById('filterBar');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

let currentFilter = ALL_LABEL;

function initials(name){
  return name.trim().slice(0,1).toUpperCase();
}

function photoInner(entity){
  if(entity.image){
    return `<img src="${entity.image}" alt="${entity.name || ''}">`;
  }
  return entity.avatarText || initials(entity.name || '?');
}

function renderProfile(){
  const wrap = document.getElementById('profileCard');
  if(!PROFILE) return;

  const linksHtml = (PROFILE.links || []).map(l =>
    `<a class="profile-link" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`
  ).join('');

  wrap.innerHTML = `
    <div class="profile-photo">${photoInner(PROFILE)}</div>
    <p class="profile-name"><span class="star">✦</span>${PROFILE.name || ''}<span class="star">✦</span></p>
    <p class="profile-bio">${PROFILE.bio || ''}</p>
    ${linksHtml ? `<div class="profile-links">${linksHtml}</div>` : ''}
  `;
}

/* 캐릭터 목록에서 플랫폼 이름을 모아 개수 세기 */
function collectPlatforms(){
  const counts = {};
  const order = [];
  CHARACTERS.forEach(c => {
    const seen = new Set();
    (c.platforms || []).forEach(p => {
      if(seen.has(p.label)) return;
      seen.add(p.label);
      if(!(p.label in counts)){ counts[p.label] = 0; order.push(p.label); }
      counts[p.label]++;
    });
  });
  return { order, counts };
}

function renderFilters(){
  const { order, counts } = collectPlatforms();
  const items = [{ label: ALL_LABEL, count: CHARACTERS.length }]
    .concat(order.map(l => ({ label: l, count: counts[l] })));

  filterBar.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (item.label === currentFilter ? ' active' : '');
    btn.type = 'button';
    btn.setAttribute('aria-pressed', item.label === currentFilter ? 'true' : 'false');
    btn.innerHTML = `${item.label}<span class="count">${item.count}</span>`;
    btn.addEventListener('click', () => {
      currentFilter = item.label;
      renderFilters();
      render();
    });
    filterBar.appendChild(btn);
  });
}

function render(){
  grid.innerHTML = '';

  const list = currentFilter === ALL_LABEL
    ? CHARACTERS
    : CHARACTERS.filter(c => (c.platforms || []).some(p => p.label === currentFilter));

  if(list.length === 0){
    grid.innerHTML = '<div class="empty">아직 등록된 캐릭터가 없어요 ✦</div>';
    return;
  }

  list.forEach((c) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', c.name + ' 상세보기');

    const platformCount = c.platforms ? c.platforms.length : 0;
    let bottomLabel;
    if(currentFilter !== ALL_LABEL){
      bottomLabel = currentFilter;
    } else {
      const firstPlatformLabel = platformCount > 0 ? c.platforms[0].label : '링크 없음';
      bottomLabel = platformCount > 1 ? firstPlatformLabel + ' 외 ' + (platformCount-1) : firstPlatformLabel;
    }

    card.innerHTML = `
      <div class="card-photo">${photoInner(c)}</div>
      <p class="card-name">${c.name}</p>
      <p class="card-desc">${c.desc || ''}</p>
      <div class="card-platform">
        <span>${bottomLabel}</span>
        <span>→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(c));
    card.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(c); }
    });

    grid.appendChild(card);
  });
}

function openModal(c){
  const photo = document.getElementById('modalAvatar');
  photo.innerHTML = photoInner(c);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalDesc').textContent = c.desc || '';

  const list = document.getElementById('platformList');
  list.innerHTML = '';

  if(!c.platforms || c.platforms.length === 0){
    list.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">등록된 플랫폼 링크가 없어요.</p>';
  } else {
    /* 필터로 고른 플랫폼을 맨 위로 올려서 보여줌 */
    const sorted = c.platforms.slice().sort((a, b) =>
      (b.label === currentFilter) - (a.label === currentFilter)
    );
    sorted.forEach(p => {
      const a = document.createElement('a');
      a.className = 'platform-link';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${p.label}</span><span class="arrow">↗</span>`;
      list.appendChild(a);
    });
  }

  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

renderProfile();
renderFilters();
render();
</script>
