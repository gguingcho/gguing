<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꾸잉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     ✏️ 여기부터 캐릭터를 추가/수정하세요! (코드 몰라도 됩니다)
     화면 아래쪽 <script> 안의 PROFILE, CHARACTERS 를 편집하면 됩니다.
     이 스타일 부분은 건드리지 않아도 됩니다.
     ============================================================ */

  :root{
    --pink: #FFB6CE;
    --pink-deep: #FF8FAE;
    --pink-tint: #FFF3F7;
    --white: #FFFFFF;
    --ink: #5C4A52;
    --ink-soft: #B79CA8;
    --line: #FBDCE6;
    --shadow: rgba(255, 143, 174, 0.16);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    background-color: #FFFDFE;
    background-image: radial-gradient(circle, rgba(255,182,206,0.5) 1.4px, transparent 1.4px);
    background-size: 24px 24px;
    position: relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* 별/점 장식 (핀터레스트 감성) */
  .deco-star{
    position: fixed;
    color: var(--pink);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  .deco-star.d1{ top: 9%;  left: 6%;  font-size: 18px; }
  .deco-star.d2{ top: 16%; right: 8%; font-size: 12px; }
  .deco-star.d3{ bottom: 20%; left: 4%; font-size: 14px; }
  .deco-star.d4{ bottom: 10%; right: 6%; font-size: 20px; }

  .top-spacer{ height: 60px; }

  /* ---------- 프로필 ---------- */
  .profile-wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 46px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .profile-photo{
    width: 92px; height: 92px;
    border-radius: 50%;
    margin: 0 auto 16px;
    overflow: hidden;
    background: var(--pink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: #fff;
    border: 4px solid var(--white);
    box-shadow: 0 0 0 3px var(--pink), 0 10px 24px -12px var(--shadow);
  }
  .profile-photo img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .profile-name{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .profile-name .star{ color: var(--pink-deep); font-size: 13px; }
  .profile-bio{
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .profile-links{
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .profile-link{
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--pink-deep);
    text-decoration: none;
    background: var(--pink-tint);
    border: 1.5px solid var(--line);
    padding: 7px 16px;
    border-radius: 999px;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }
  .profile-link:hover{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }

  /* ---------- 점선 구분 ---------- */
  .dot-divider{
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 34px;
    position: relative;
    z-index: 1;
  }
  .dot-divider span{
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--pink);
    opacity: 0.5;
  }

  /* ---------- 카드 그리드 ---------- */
  main{
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px 100px;
    position: relative;
    z-index: 1;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }

  .card{
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 16px 16px 18px;
    cursor: pointer;
    box-shadow: 0 8px 20px -14px var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display:flex;
    flex-direction: column;
    position: relative;
  }
  .card:hover, .card:focus-visible{
    transform: translateY(-5px);
    border-color: var(--pink);
    box-shadow: 0 16px 28px -14px var(--shadow);
    outline: none;
  }
  .card:focus-visible{
    outline: 2px solid var(--pink-deep);
    outline-offset: 3px;
  }

  .card-photo{
    width: 56px; height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--pink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    border: 3px solid var(--pink-tint);
  }
  .card-photo img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-name{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.35;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .card-desc{
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
    flex-grow: 1;
  }
  .card-platform{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1.5px dotted var(--line);
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    color: var(--pink-deep);
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .card-platform span:last-child{ transition: transform 0.18s ease; }
  .card:hover .card-platform span:last-child{ transform: translateX(3px); }

  /* ---------- 모달 ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(255, 243, 247, 0.75);
    backdrop-filter: blur(5px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease;
    z-index: 50;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    background: var(--white);
    color: var(--ink);
    max-width: 340px;
    width:100%;
    border-radius: 24px;
    padding: 28px 24px 24px;
    position: relative;
    border: 1.5px solid var(--line);
    text-align: center;
    transform: translateY(10px) scale(0.97);
    transition: transform 0.2s ease;
    box-shadow: 0 26px 48px -20px rgba(255,143,174,0.28);
  }
  .overlay.open .modal{ transform: translateY(0) scale(1); }

  .modal-close{
    position:absolute; top:14px; right:14px;
    width:28px; height:28px;
    border-radius:50%;
    border: none;
    background: var(--pink-tint);
    color: var(--pink-deep);
    font-size: 13px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.16s ease;
  }
  .modal-close:hover{ background: var(--pink); color:#fff; }

  .modal .card-photo{
    width: 72px; height: 72px;
    font-size: 26px;
    margin: 0 auto 14px;
  }
  .modal-name{
    font-family:'Poppins', sans-serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .modal-desc{
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .platform-list{
    display:flex; flex-direction:column; gap:9px;
    text-align: left;
  }
  .platform-link{
    display:flex; align-items:center; justify-content: space-between;
    padding: 12px 16px;
    background: var(--pink-tint);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    text-decoration:none;
    color: var(--ink);
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  .platform-link:hover{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }
  .platform-link:hover .arrow{ color: #fff; }
  .platform-link .arrow{ color: var(--pink-deep); font-weight: 700; }

  footer{
    text-align:center;
    padding: 8px 20px 44px;
    font-family:'Poppins', sans-serif;
    font-size: 10.5px;
    color: var(--ink-soft);
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }

  .empty{
    grid-column: 1/-1;
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 13px;
    background: var(--white);
    border-radius: 20px;
    border: 1.5px dashed var(--line);
  }
</style>
</head>
<body>

<span class="deco-star d1">✦</span>
<span class="deco-star d2">✧</span>
<span class="deco-star d3">✦</span>
<span class="deco-star d4">✧</span>

<div class="top-spacer"></div>

<div class="profile-wrap" id="profileCard"></div>

<div class="dot-divider"><span></span><span></span><span></span></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>made with 🩷</footer>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="closeBtn" aria-label="닫기">✕</button>
    <div class="card-photo" id="modalAvatar"></div>
    <p class="modal-name" id="modalName"></p>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="platform-list" id="platformList"></div>

</div>

<script>

/* ================================================================

   ================================================================
   PROFILE: 내 프로필 정보
   CHARACTERS: 캐릭터 목록. { } 블록 하나가 캐릭터 한 명입니다.
   새 캐릭터를 추가하려면 아무 블록이나 복사해서 붙여넣고
   내용만 바꾸면 됩니다. (콤마 , 빼먹지 않도록 주의!)

   각 항목 설명:
   - name    : 이름
   - image   : 사진 파일명 (예: "character1.jpg"), 없으면 ""
   - desc    : 짧은 소개 (한두 줄)
   - platforms : 플레이 가능한 플랫폼 목록 (label, url)

   ⚠️ 참고: 글자를 큰따옴표(" ") 안에 쓸 때는 중간에 엔터(줄바꿈)를
   치면 코드가 깨져요. 줄바꿈하고 싶으면 큰따옴표 대신 백틱(` `)을
   쓰면 엔터를 쳐도 안전해요.
   ================================================================ */

const PROFILE = {

  links: [

  ]
};

const CHARACTERS = [

    ]
  },
  {
    name: "광공의 강아지입니다!",
    image: "gg.jpg",
    desc: "자기 전 읽었던 BL 소설 속 광공의 강아지로 빙의했다.",
    platforms: [
      { label: "BabeChat", url: "https://www.babechat.ai/character/u/3b79e195-7fa1-47ae-b9c9-57bdc97d055f/profile" },
      { label: "Tookit", url: "https://tookit.ai/character/u/3b79e195-7fa1-47ae-b9c9-57bdc97d055f/profile" },
      { label: "Bloom", url: "https://bloom-ai.me/content/40a86a0c-0b74-4def-acae-13d0791a2b98" },
      { label: "Plaitoon", url: "https://www.plaitoon.com/ko/characters/676862cf-7c91-4a32-a704-20ed4e1bbaf7" },
      { label: "zeta", url: "https://zeta-ai.io/ko/plots/878e12af-2f05-4422-81db-f9973143d8f4/profile?share_id=ifeyk0uhc" },
      { label: "CCUC", url: "https://ccuc.chat/character/01KZYJ72EZWPGH2JWBHPMK7MGW" },
    ]
  },
    {
    name: "박상혁",
    image: "sh.jpg",
    desc: "사고치는 나를 위한 비서",

      { label: "BabeChat", url: "https://www.babechat.ai/character/u/7464b8e1-b923-4ebf-ada9-2edfb7a76c3e/profile" },
      { label: "Tookit", url: "https://tookit.ai/character/u/7464b8e1-b923-4ebf-ada9-2edfb7a76c3e/profile" },
      { label: "Neona", url: "https://neonachat.io/share?id=6a40963c676ff89d4daa1ce3" },
    ]
  },
  {

    desc: "나의 사고뭉치 전무님",
    platforms: [
      { label: "BabeChat", url: "https://www.babechat.ai/character/u/edc7378e-bc4f-451c-b10c-24a1d889cd4e/profile" },
      { label: "Neona", url: "https://neonachat.io/share?id=6a413c37676ff89d4daa4e25" },
    ]
  },
  {
    name: "잘생긴 남샤친 소개시켜줘야쥬 🥴",
    image: "nn.jpg",
    desc: "응?ㅋㅋㅋㅋ 내가 만날 남자도 없다ㅋㅋㅋ",
    platforms: [
      { label: "BabeChat", url: "https://www.babechat.ai/character/u/f7ec9501-781e-48d3-b4f7-e9e37f0021ef/profile" },
      { label: "Tookit", url: "https://tookit.ai/character/u/f7ec9501-781e-48d3-b4f7-e9e37f0021ef/profile" },
    ]
  },
    {

    desc: "최악의 소개팅 상대가 직장 상사가 됐다.",
    platforms: [
      { label: "CCUC", url: "https://ccuc.chat/character/01KZH1BJYX5GGMRGJRFACCJZGK" },
    ]
  },
  {
    name: "이 모기 새끼 어디 갔어?",
    image: "mg.jpg",
    desc: "앵——",
    platforms: [
      { label: "BabeChat", url: "https://www.babechat.ai/character/u/d2180458-49cd-495f-b96f-6b0358901b91/profile" },
      { label: "Tookit", url: "https://tookit.ai/character/u/d2180458-49cd-495f-b96f-6b0358901b91/profile" },
    ]
  },
];

/* ================================================================
   아래부터는 화면을 그려주는 코드입니다. (수정 필요 없음)
   ================================================================ */

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

function initials(name){
  return name.trim().slice(0,1).toUpperCase();
}

function photoInner(entity){
  if(entity.image){
    return `<img src="${entity.image}" alt="${entity.name || ''}">`;
  }
  return entity.avatarText || initials(entity.name || '?');
}

function renderProfile(){
  const wrap = document.getElementById('profileCard');
  if(!PROFILE) return;

  const linksHtml = (PROFILE.links || []).map(l =>
    `<a class="profile-link" href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`
  ).join('');

  wrap.innerHTML = `
    <div class="profile-photo">${photoInner(PROFILE)}</div>
    <p class="profile-name"><span class="star">✦</span>${PROFILE.name || ''}<span class="star">✦</span></p>
    <p class="profile-bio">${PROFILE.bio || ''}</p>
    ${linksHtml ? `<div class="profile-links">${linksHtml}</div>` : ''}
  `;
}

function render(){
  grid.innerHTML = '';

  if(CHARACTERS.length === 0){
    grid.innerHTML = '<div class="empty">아직 등록된 캐릭터가 없어요 ✦</div>';
    return;
  }

  CHARACTERS.forEach((c) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', c.name + ' 상세보기');

    const platformCount = c.platforms ? c.platforms.length : 0;
    const firstPlatformLabel = platformCount > 0 ? c.platforms[0].label : '링크 없음';

    card.innerHTML = `
      <div class="card-photo">${photoInner(c)}</div>
      <p class="card-name">${c.name}</p>
      <p class="card-desc">${c.desc || ''}</p>
      <div class="card-platform">
        <span>${platformCount > 1 ? firstPlatformLabel + ' 외 ' + (platformCount-1) : firstPlatformLabel}</span>
        <span>→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(c));
    card.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(c); }
    });

    grid.appendChild(card);
  });
}

function openModal(c){
  const photo = document.getElementById('modalAvatar');
  photo.innerHTML = photoInner(c);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalDesc').textContent = c.desc || '';

  const list = document.getElementById('platformList');
  list.innerHTML = '';

  if(!c.platforms || c.platforms.length === 0){
    list.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">등록된 플랫폼 링크가 없어요.</p>';
  } else {
    c.platforms.forEach(p => {
      const a = document.createElement('a');
      a.className = 'platform-link';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${p.label}</span><span class="arrow">↗</span>`;
      list.appendChild(a);
    });
  }

  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

renderProfile();
render();
</script>

</body>
</html>
