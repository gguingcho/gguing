<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 캐릭터 컬렉션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     ✏️ 여기부터 캐릭터를 추가/수정하세요! (코드 몰라도 됩니다)
     화면 아래쪽 <script> 안의 CHARACTERS 배열만 편집하면 됩니다.
     이 스타일 부분은 건드리지 않아도 됩니다.
     ============================================================ */

  :root{
    --bg-a: #FFF3F7;        /* 배경 그라데이션 시작 (연분홍) */
    --bg-b: #FFE6EF;        /* 배경 그라데이션 끝 */
    --paper: #FFFFFF;       /* 카드 색 (흰색) */
    --ink: #6E4A5C;         /* 부드러운 다크 핑크브라운 텍스트 */
    --ink-soft: #A97F92;
    --pink: #FF7FA6;        /* 메인 포인트 색 */
    --pink-deep: #FF5D93;
    --pink-pale: #FFE1EC;   /* 옅은 핑크 (테두리/보더용) */
    --lilac: #FFC9DD;
    --shadow: rgba(255, 127, 166, 0.22);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 85% -8%, #FFDCEA 0%, transparent 55%),
      radial-gradient(700px 500px at -5% 20%, #FFF0F5 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* 둥둥 떠다니는 배경 장식 */
  .deco{
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: float 7s ease-in-out infinite;
  }
  .deco1{ top: 8%; left: 6%; width: 26px; height: 26px; background: var(--lilac); animation-delay: 0s; }
  .deco2{ top: 22%; right: 10%; width: 16px; height: 16px; background: var(--pink); animation-delay: 1.2s; }
  .deco3{ bottom: 12%; left: 12%; width: 20px; height: 20px; background: var(--pink-pale); border: 2px solid var(--pink); animation-delay: 2s; }
  @keyframes float{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-14px) rotate(10deg); }
  }

  /* ---------- 헤더 ---------- */
  header{
    max-width: 1080px;
    margin: 0 auto;
    padding: 72px 28px 36px;
    position: relative;
    z-index: 1;
  }
  .eyebrow{
    font-family: 'Poppins', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--pink-deep);
    text-transform: uppercase;
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.15;
    margin: 0 0 16px;
    color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 var(--pink-pale);
  }
  h1 .sparkle{
    display: inline-block;
    animation: wiggle 2.4s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%, 100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(12deg); }
  }
  header p{
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0;
  }
  .count{
    font-family:'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--pink);
    margin-top: 20px;
    display: inline-block;
    background: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 14px var(--shadow);
  }

  /* ---------- 카드 그리드 ---------- */
  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px 100px;
    position: relative;
    z-index: 1;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 22px;
  }

  .card{
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 26px;
    padding: 22px 20px 20px;
    cursor: pointer;
    border: 3px solid var(--pink-pale);
    box-shadow: 0 10px 0 -4px var(--pink-pale), 0 14px 26px -10px var(--shadow);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease, border-color 0.22s ease;
    display:flex;
    flex-direction: column;
    min-height: 236px;
  }
  .card:hover, .card:focus-visible{
    transform: translateY(-6px) scale(1.02) rotate(-1deg);
    border-color: var(--pink);
    box-shadow: 0 10px 0 -4px var(--pink), 0 20px 32px -12px var(--shadow);
    outline: none;
  }
  .card:focus-visible{
    outline: 3px solid var(--pink-deep);
    outline-offset: 3px;
  }
  .card-no{
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--lilac);
    letter-spacing: 0.04em;
  }
  .avatar{
    width: 54px; height: 54px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin: 10px 0 14px;
    flex-shrink: 0;
    border: 3px solid #fff;
    box-shadow: 0 4px 10px var(--shadow);
  }
  .card-name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.25;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .card-desc{
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
    flex-grow: 1;
  }
  .card-platform{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px dotted var(--pink-pale);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.01em;
    color: var(--pink-deep);
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .card-platform span:last-child{
    transition: transform 0.2s ease;
  }
  .card:hover .card-platform span:last-child{
    transform: translateX(4px);
  }

  /* ---------- 모달 ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(255, 214, 228, 0.55);
    backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    opacity:0; pointer-events:none;
    transition: opacity 0.22s ease;
    z-index: 50;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    background: var(--paper);
    color: var(--ink);
    max-width: 420px;
    width:100%;
    border-radius: 30px;
    padding: 32px 28px 28px;
    position: relative;
    border: 3px solid var(--pink-pale);
    transform: translateY(14px) scale(0.96);
    transition: transform 0.24s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 30px 60px -20px rgba(255,93,147,0.35);
  }
  .overlay.open .modal{ transform: translateY(0) scale(1); }

  .modal-close{
    position:absolute; top:18px; right:18px;
    width:32px; height:32px;
    border-radius:50%;
    border: 2px solid var(--pink-pale);
    background: #fff;
    color: var(--pink-deep);
    font-size: 15px;
    font-weight: 700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.16s ease, transform 0.16s ease;
  }
  .modal-close:hover{ background: var(--pink-pale); transform: rotate(90deg); }

  .modal .avatar{ width:64px; height:64px; font-size:26px; }
  .modal-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 24px;
    margin: 4px 0 8px;
    color: var(--pink-deep);
  }
  .modal-desc{
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }
  .platform-list{
    display:flex; flex-direction:column; gap:10px;
  }
  .platform-link{
    display:flex; align-items:center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-a);
    border: 2px solid var(--pink-pale);
    border-radius: 16px;
    text-decoration:none;
    color: var(--ink);
    font-family:'Poppins', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }
  .platform-link:hover{
    background: var(--pink-pale);
    border-color: var(--pink);
    transform: translateX(2px);
  }
  .platform-link .arrow{
    font-family:'Poppins', sans-serif;
    color: var(--pink-deep);
    font-weight: 700;
  }

  footer{
    text-align:center;
    padding: 30px 20px 50px;
    font-family:'Poppins', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-soft);
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }

  .empty{
    grid-column: 1/-1;
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
    background: #fff;
    border-radius: 24px;
    border: 3px dashed var(--pink-pale);
  }
</style>
</head>
<body>

<div class="deco deco1"></div>
<div class="deco deco2"></div>
<div class="deco deco3"></div>

<header>
  <p class="eyebrow">✨ Character Archive</p>
  <h1>내가 만든 <span class="sparkle">🎀</span><br>AI 캐릭터 모음</h1>
  <p>카드를 콕 누르면 어느 플랫폼에서 대화할 수 있는지 알려줘요!</p>
  <p class="count" id="countText"></p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>made with 🩷 on Cloudflare Pages</footer>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="closeBtn" aria-label="닫기">✕</button>
    <div class="avatar" id="modalAvatar"></div>
    <p class="modal-name" id="modalName"></p>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="platform-list" id="platformList"></div>
  </div>
</div>

<script>

/* ================================================================
   ✏️✏️✏️  캐릭터 추가는 여기서! ✏️✏️✏️
   ================================================================
   아래 CHARACTERS 배열에 { } 블록 하나가 캐릭터 한 명입니다.
   새 캐릭터를 추가하려면 아무 블록이나 복사해서 붙여넣고
   내용만 바꾸면 됩니다. (콤마 , 빼먹지 않도록 주의!)

   각 항목 설명:
   - name        : 캐릭터 이름
   - color       : 카드 아바타 동그라미 색 (예: "#FF7FA6")
                   핑크 톤과 잘 어울리는 색: #FF7FA6, #FFB6C1, #C9A0FF,
                   #FFA8CC, #FF9AA2, #B39DDB 등을 추천해요.
   - desc        : 짧은 소개 (한두 줄)
   - platforms   : 플레이 가능한 플랫폼 목록.
                   여러 개 넣을 수 있어요.
                   - label : 버튼에 보일 이름 (예: "제타 (Zeta)")
                   - url   : 그 플랫폼의 캐릭터 링크
   ================================================================ */

const CHARACTERS = [
  {
    name: "예시 캐릭터",
    color: "#FF7FA6",
    desc: "여기에 캐릭터 소개를 적어주세요. 성격, 세계관 등 자유롭게!",
    platforms: [
      { label: "제타 (Zeta)", url: "https://zeta.character.ai" },
      { label: "카카오 캐릭터챗", url: "https://character.kakao.com" }
    ]
  },
  {
    name: "두번째 캐릭터",
    color: "#C9A0FF",
    desc: "이 블록을 복사해서 캐릭터를 계속 추가하세요.",
    platforms: [
      { label: "Character.AI", url: "https://character.ai" }
    ]
  }
];

/* ================================================================
   아래부터는 화면을 그려주는 코드입니다. (수정 필요 없음)
   ================================================================ */

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const countText = document.getElementById('countText');

function initials(name){
  return name.trim().slice(0,1).toUpperCase();
}

function render(){
  grid.innerHTML = '';
  countText.textContent = '🩷 ' + CHARACTERS.length + '개의 캐릭터';

  if(CHARACTERS.length === 0){
    grid.innerHTML = '<div class="empty">아직 등록된 캐릭터가 없어요. 스크립트의 CHARACTERS 배열에 추가해보세요 🎀</div>';
    return;
  }

  CHARACTERS.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('aria-label', c.name + ' 상세보기');

    const platformCount = c.platforms ? c.platforms.length : 0;
    const firstPlatformLabel = platformCount > 0 ? c.platforms[0].label : '링크 없음';

    card.innerHTML = `
      <span class="card-no">No. ${String(i+1).padStart(3,'0')}</span>
      <div class="avatar" style="background:${c.color || '#FF7FA6'}">${initials(c.name)}</div>
      <p class="card-name">${c.name}</p>
      <p class="card-desc">${c.desc || ''}</p>
      <div class="card-platform">
        <span>${platformCount > 1 ? firstPlatformLabel + ' 외 ' + (platformCount-1) : firstPlatformLabel}</span>
        <span>→</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(c));
    card.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(c); }
    });

    grid.appendChild(card);
  });
}

function openModal(c){
  document.getElementById('modalAvatar').style.background = c.color || '#FF7FA6';
  document.getElementById('modalAvatar').textContent = initials(c.name);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalDesc').textContent = c.desc || '';

  const list = document.getElementById('platformList');
  list.innerHTML = '';

  if(!c.platforms || c.platforms.length === 0){
    list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">등록된 플랫폼 링크가 없어요.</p>';
  } else {
    c.platforms.forEach(p => {
      const a = document.createElement('a');
      a.className = 'platform-link';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${p.label}</span><span class="arrow">↗</span>`;
      list.appendChild(a);
    });
  }

  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

render();
</script>

</body>
</html>
